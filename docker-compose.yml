version: '3.8'

services:
  mcp-obsidian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-obsidian
    restart: unless-stopped

    # Environment variable for vault path
    environment:
      - VAULT_PATH=/vault

    # Mount vault directory
    volumes:
      - ${VAULT_PATH:-./vault}:/vault:ro  # Read-only mount of vault

    # Standard input/output for MCP protocol
    stdin_open: true
    tty: true

    # For debugging: keep container running
    # command: tail -f /dev/null
